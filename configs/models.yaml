# Model Provenance Manifest for Phase 0 Multiple-Choice Screen
# Specification Reference: §4 & §10

experiment_version: "1.0.0-expanded"
date: "2026-11-04"
experiment_name: "Phase 0 - Pretrained Cooperation Representations Replication and Expansion Screen"

