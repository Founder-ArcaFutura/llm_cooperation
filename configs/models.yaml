    family: "qwen"
    size: "3B"
    is_base: true
    precision: "bfloat16"
    recommended_gpu: "A10G"
    recommended_gpu_mem_gb: 8
    prompt_mode_support: ["standard_plaintext"]
    tokenizer_name: "Qwen/Qwen2.5-3B"
    notes: "Verified pretrained base checkpoint, no SFT or chat template."

