  pythia_12b_sft:
    name: "OpenAssistant/oasst-sft-1-pythia-12b"
    hf_id: "OpenAssistant/oasst-sft-1-pythia-12b"
    revision: "293df535fe7711a5726987fc2f17dfc87de452a1"
    family: "pythia"
    size: "12B"
    is_base: false
    precision: "bfloat16"
    recommended_gpu: "L40S"
    recommended_gpu_mem_gb: 32
    notes: "Actual supervised-fine-tuned Pythia-12B model based on pythia-12b-deduped. Designated as post-trained comparator only."
    prompt_mode_support: ["standard_plaintext", "openassistant"]

  qwen2.5_3b_instruct:
    name: "Qwen/Qwen2.5-3B-Instruct"
    hf_id: "Qwen/Qwen2.5-3B-Instruct"
    family: "qwen"
    size: "3B"
    is_base: false
    precision: "bfloat16"
    recommended_gpu_mem_gb: 8
    notes: "Matched instruct counterpart for training-stage comparison."

decoding_parameters:
  max_new_tokens: 5
  temperature: 0.0
  do_sample: false
  forced_choice_letters: ["A", "B", "C", "D"]
