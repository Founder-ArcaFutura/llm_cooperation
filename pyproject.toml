[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cooperation"
version = "0.2.0"
description = "Harness and analysis pipeline for pretrained cooperation representations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Adrian Hau", email = "research@example.com"}
]
keywords = ["llm", "mechanistic-interpretability", "cooperation", "game-theory", "ai-alignment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
gpu = [
    "flash-attn>=2.5.0",
    "vllm>=0.4.0",
]

[project.scripts]
llm-coop = "llm_cooperation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_cooperation*"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["."]
